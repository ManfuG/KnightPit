name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check release version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
      - run: npm ci
      - run: python3 KnightPitAI/tools/check_publication.py
      - run: npm run test:engine
      - run: npm run android:sync
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.KNIGHTPIT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/knightpit.jks"
          chmod 600 "$RUNNER_TEMP/knightpit.jks"
      - name: Build signed APK
        working-directory: android
        env:
          KNIGHTPIT_KEYSTORE_PATH: ${{ runner.temp }}/knightpit.jks
          KNIGHTPIT_KEYSTORE_PASSWORD: ${{ secrets.KNIGHTPIT_KEYSTORE_PASSWORD }}
          KNIGHTPIT_KEY_ALIAS: knightpit
          KNIGHTPIT_KEY_PASSWORD: ${{ secrets.KNIGHTPIT_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
      - run: python3 scripts/check-android.py android/app/build/outputs/apk/release/app-release.apk
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/KnightPit-Android.apk"
          cd "$RUNNER_TEMP/release"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs KnightPit-Android.apk > SIGNING-CERTIFICATE.txt
          sha256sum KnightPit-Android.apk > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" KnightPit-Android.apk SHA256SUMS SIGNING-CERTIFICATE.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "KnightPit ${GITHUB_REF_NAME#v} · Android" --notes "Download KnightPit-Android.apk below and open it on Android to install. Allow installation from your browser when Android asks. Chess engine, fonts and artwork are bundled for offline use. Keep the same app installed when updating to preserve local data. Android 8 or newer and System WebView 119 or newer are required. Checksums and public signing-certificate details are attached."
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/knightpit.jks"
