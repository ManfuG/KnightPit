name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        working-directory: KnightPitAI
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Python tests
        working-directory: KnightPitAI
        run: python -m pytest
      - name: Prepare generated output directories
        working-directory: KnightPitAI
        run: python -c "from pathlib import Path; Path('data/generated').mkdir(parents=True, exist_ok=True)"
      - name: Self-play smoke
        working-directory: KnightPitAI
        env:
          PYTHONPATH: src
        run: python -m knightpit_ai self-play --games 2 --simulations 2 --max-ply 24 --seed 42 --output data/generated/ci-smoke.jsonl
      - name: Publication audit
        working-directory: KnightPitAI
        run: python tools/check_publication.py
      - name: Frontend build
        run: npm ci && npm run build
