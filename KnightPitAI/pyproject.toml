[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knightpit-ai"
version = "0.1.0"
description = "Small CPU-only chess reinforcement-learning prototype for KnightPit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24,<3",
  "fastapi>=0.100,<1",
  "uvicorn>=0.23,<1",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "httpx>=0.24,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
